name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

  lint:
    runs-on: ubuntu-latest
    needs: wrapper-validation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Run Lint
        run: ./gradlew --dependency-verification=strict lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Run Unit Tests
        run: ./gradlew --dependency-verification=strict testDebugUnitTest

  gemini-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: companion/gemini/package-lock.json

      - name: Install pinned companion dependencies
        working-directory: companion/gemini
        run: npm ci

      - name: Verify Gemini companion
        working-directory: companion/gemini
        run: |
          npm run check
          npm test
          npm audit --omit=dev

  claude-companion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: companion/claude/package-lock.json

      - name: Install pinned companion dependencies
        working-directory: companion/claude
        run: npm ci --omit=dev

      - name: Verify Claude companion
        working-directory: companion/claude
        run: |
          npm run check
          npm test

      - name: Smoke test native PTY
        working-directory: companion/claude
        run: npm run smoke:pty

      - name: Check Windows resident host
        if: runner.os == 'Windows'
        working-directory: companion/claude
        run: powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/windows-resident.ps1 -Action Check

      - name: Audit Claude companion dependencies
        if: runner.os == 'Linux'
        working-directory: companion/claude
        run: |
          npm audit --omit=dev

  antigravity-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: companion/antigravity/package-lock.json
      - name: Verify Antigravity companion
        working-directory: companion/antigravity
        run: |
          npm ci
          npm run check
          npm test
          npm audit --omit=dev
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/windows-resident.ps1 -Action Check

  codex-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: companion/codex/package-lock.json

      - name: Install pinned companion dependencies
        working-directory: companion/codex
        run: npm ci

      - name: Verify Codex telemetry companion
        working-directory: companion/codex
        run: |
          npm run check
          npm test
          npm audit --omit=dev

  build:
    runs-on: ubuntu-latest
    needs: [test, claude-companion, gemini-companion, codex-companion, antigravity-companion]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Build Debug APK
        run: ./gradlew --dependency-verification=strict assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
